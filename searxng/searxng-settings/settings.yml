use_default_settings: true
search:
  safe_search: 0
  formats:
    - html
    - json
server:
  secret_key: "okazu-finder-random-secret-change-me"
  bind_address: "0.0.0.0"
  limiter: false
engines:
  - name: google
    engine: google
    shortcut: g
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
  - name: bing
    engine: bing
    shortcut: bi
  - name: brave
    engine: brave
    shortcut: br
  - name: qwant
    engine: qwant
    shortcut: qw
outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
