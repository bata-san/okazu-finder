[package]
name = "okazu-finder-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
scraper = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
futures = "0.3"